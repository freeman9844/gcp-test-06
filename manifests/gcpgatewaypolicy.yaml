# FrontendConfig 대체 (redirectToHttps 는 HTTPRoute에서 처리)
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: openfga-gateway-policy
  namespace: test01
spec:
  default:
    sslPolicy: ssl-policy-tls-1-2
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: openfga-gateway
